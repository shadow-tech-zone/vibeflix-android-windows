name: Publish Android phone release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: android-release
    env:
      GH_TOKEN: ${{ github.token }}
      VIBEFLIX_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VIBEFLIX_SUPABASE_PUBLISHABLE_KEY }}
      VIBEFLIX_KEYSTORE_PASSWORD: ${{ secrets.VIBEFLIX_KEYSTORE_PASSWORD }}
      EXPECTED_CERT_SHA256: ${{ vars.VIBEFLIX_EXPECTED_CERT_SHA256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate release metadata and reserve a new tag
        run: |
          set -euo pipefail
          python3 - "$GITHUB_WORKSPACE/release.json" "$GITHUB_ENV" <<'PY'
          import json
          import re
          import sys

          config = json.load(open(sys.argv[1], encoding='utf-8'))
          version_code = config.get('versionCode')
          version_name = config.get('versionName')
          tag = config.get('tag')
          asset = config.get('asset')
          title = config.get('title')
          if not isinstance(version_code, int) or version_code < 1:
              raise SystemExit('release.json versionCode must be a positive integer')
          if not isinstance(version_name, str) or not re.fullmatch(r'[A-Za-z0-9._-]{1,64}', version_name):
              raise SystemExit('release.json versionName contains invalid characters')
          if not isinstance(tag, str) or not re.fullmatch(r'[A-Za-z0-9._-]{1,120}', tag):
              raise SystemExit('release.json tag contains invalid characters')
          if not isinstance(asset, str) or not asset.endswith('.apk') or not re.fullmatch(r'[A-Za-z0-9._-]+', asset[:-4]):
              raise SystemExit('release.json asset must be a plain APK filename')
          if not isinstance(title, str) or not title.strip() or any(ord(c) in (10, 13) for c in title):
              raise SystemExit('release.json title is invalid')
          with open(sys.argv[2], 'a', encoding='utf-8') as env:
              for key, value in (
                  ('RELEASE_VERSIONCODE', version_code),
                  ('RELEASE_VERSIONNAME', version_name),
                  ('RELEASE_TAG', tag),
                  ('RELEASE_ASSET', asset),
                  ('RELEASE_TITLE', title),
              ):
                  print(f'{key}={value}', file=env)
          PY

          REMOTE_TAGS="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"
          if [ -n "$REMOTE_TAGS" ]; then
            echo "Tag $RELEASE_TAG already exists. Bump release.json; tags are never reused." >&2
            exit 1
          fi

      - name: Prepare Android source archive
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/vibeflix-src"
          unzip -q android/vibeflix-v31-source.zip -d "$SRC"
          PROJECT="$SRC/VibeFlix-AndroidStudio"
          test -f "$PROJECT/gradlew"
          echo "ANDROID_PROJECT=$PROJECT" >> "$GITHUB_ENV"
          cd "$PROJECT"

          python3 - <<'PY'
          import os
          from pathlib import Path

          gradle = Path('app/build.gradle')
          text = gradle.read_text(encoding='utf-8')
          replacements = (
              ("applicationId 'org.example.play4u.movyexperiment'", "applicationId 'org.example.play4u.movyexperiment.v31'"),
              ('versionCode 31', 'versionCode ' + os.environ['RELEASE_VERSIONCODE']),
              ("versionName '5.4-catalog-recovery-review31'", "versionName '" + os.environ['RELEASE_VERSIONNAME'] + "'"),
              ('signingConfig signingConfigs.debug;', ''),
          )
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one baseline marker: {old}')
              text = text.replace(old, new, 1)
          gradle.write_text(text, encoding='utf-8')

          manifest = Path('app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          old_label = 'android:label="Vibeflix Experiment"'
          if text.count(old_label) != 1:
              raise SystemExit('Expected baseline app label was not found exactly once')
          manifest.write_text(text.replace(old_label, 'android:label="Vibeflix"', 1), encoding='utf-8')
          PY

          echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > local.properties
          chmod +x gradlew

      - name: Run phone unit tests
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT"
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Materialize protected signing key and rotation lineage
        env:
          VIBEFLIX_KEYSTORE_BASE64: ${{ secrets.VIBEFLIX_KEYSTORE_BASE64 }}
          VIBEFLIX_SIGNING_LINEAGE_BASE64: ${{ secrets.VIBEFLIX_SIGNING_LINEAGE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$VIBEFLIX_KEYSTORE_BASE64" || { echo 'Missing protected VIBEFLIX_KEYSTORE_BASE64 secret.' >&2; exit 1; }
          test -n "$VIBEFLIX_SIGNING_LINEAGE_BASE64" || { echo 'Missing protected VIBEFLIX_SIGNING_LINEAGE_BASE64 secret.' >&2; exit 1; }
          test -n "$VIBEFLIX_KEYSTORE_PASSWORD" || { echo 'Missing protected VIBEFLIX_KEYSTORE_PASSWORD secret.' >&2; exit 1; }
          test -n "$EXPECTED_CERT_SHA256" || { echo 'Missing android-release environment variable VIBEFLIX_EXPECTED_CERT_SHA256.' >&2; exit 1; }
          KEYSTORE="$RUNNER_TEMP/vibeflix-release.p12"
          LINEAGE="$RUNNER_TEMP/vibeflix-signing-lineage.bin"
          printf '%s' "$VIBEFLIX_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          printf '%s' "$VIBEFLIX_SIGNING_LINEAGE_BASE64" | base64 --decode > "$LINEAGE"
          chmod 600 "$KEYSTORE" "$LINEAGE"
          test -s "$KEYSTORE"
          test -s "$LINEAGE"
          echo "VIBEFLIX_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "VIBEFLIX_SIGNING_LINEAGE=$LINEAGE" >> "$GITHUB_ENV"

      - name: Build unsigned release APK
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT"
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          APK="$ANDROID_PROJECT/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          cp "$APK" "$RUNNER_TEMP/gradle-output-unsigned.apk"

      - name: Sign with the approved key lineage and verify metadata
        run: |
          set -euo pipefail
          UNSIGNED_APK="$RUNNER_TEMP/gradle-output-unsigned.apk"
          APK="$RUNNER_TEMP/$RELEASE_ASSET"
          BT_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools"
          APKSIGNER="$(find "$BT_ROOT" -name apksigner -type f | sort -V | tail -1)"
          AAPT="$(find "$BT_ROOT" -name aapt -type f | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" sign --ks "$VIBEFLIX_KEYSTORE" --ks-type PKCS12 --ks-key-alias debug --ks-pass env:VIBEFLIX_KEYSTORE_PASSWORD --key-pass env:VIBEFLIX_KEYSTORE_PASSWORD --lineage "$VIBEFLIX_SIGNING_LINEAGE" --out "$APK" "$UNSIGNED_APK"
          "$APKSIGNER" verify --verbose "$APK"
          CERT="$("$APKSIGNER" verify --print-certs "$APK" | grep 'Signer #1 certificate SHA-256 digest' | awk '{print $NF}')"
          if [ "$CERT" != "$EXPECTED_CERT_SHA256" ]; then
            echo 'APK certificate does not match the approved expected fingerprint.' >&2
            exit 1
          fi
          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"
          [[ "$BADGING" == *"name='org.example.play4u.movyexperiment.v31'"* ]]
          [[ "$BADGING" == *"versionCode='$RELEASE_VERSIONCODE'"* ]]
          [[ "$BADGING" == *"versionName='$RELEASE_VERSIONNAME'"* ]]
          HASH="$(sha256sum "$APK" | awk '{print $1}')"
          {
            echo "RELEASE_CERT_SHA256=$CERT"
            echo "RELEASE_APK_SHA256=$HASH"
          } >> "$GITHUB_ENV"
          echo 'Signing lineage, certificate fingerprint, and package metadata verified.'

      - name: Publish GitHub release
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Hobby/personal-use disclaimer: Vibeflix is a personal hobby project for personal use. It is not a commercial product and is not affiliated with Netflix or any content provider. Provided as-is, without warranties. Use only content and services you are authorized to access.

          Package: org.example.play4u.movyexperiment.v31
          Version: $RELEASE_VERSIONCODE / $RELEASE_VERSIONNAME
          APK SHA-256: $RELEASE_APK_SHA256
          Signing certificate SHA-256: $RELEASE_CERT_SHA256
          apksigner verify: PASS
          CI unit tests: PASS

          CI does not prove live playback, provider availability, real-device behavior, or Play Protect clearance. A Play Protect warning was previously observed and remains unresolved; keep Play Protect enabled and do not advise bypassing it.
          EOF
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/$RELEASE_ASSET" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TITLE" --notes-file "$RUNNER_TEMP/release-notes.md"
          echo "Published release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          echo "Published asset: https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$RELEASE_ASSET"

      - name: Remove temporary signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/vibeflix-release.p12" "$RUNNER_TEMP/vibeflix-signing-lineage.bin"
