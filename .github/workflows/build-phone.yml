name: Verify Android phone build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'release.json'
      - '.github/workflows/build-phone.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'release.json'
      - '.github/workflows/build-phone.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Unit tests and debug package verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release metadata
        run: |
          python3 - "$GITHUB_WORKSPACE/release.json" "$GITHUB_ENV" <<'PY'
          import json
          import re
          import sys

          config = json.load(open(sys.argv[1], encoding='utf-8'))
          version_code = config.get('versionCode')
          version_name = config.get('versionName')
          if not isinstance(version_code, int) or version_code < 1:
              raise SystemExit('release.json versionCode must be a positive integer')
          if not isinstance(version_name, str) or not re.fullmatch(r'[A-Za-z0-9._-]{1,64}', version_name):
              raise SystemExit('release.json versionName contains invalid characters')
          with open(sys.argv[2], 'a', encoding='utf-8') as env:
              env.write(f'RELEASE_VERSIONCODE={version_code}\n')
              env.write(f'RELEASE_VERSIONNAME={version_name}\n')
          PY

      - name: Prepare Android source archive
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/vibeflix-src"
          unzip -q android/vibeflix-v31-source.zip -d "$SRC"
          PROJECT="$SRC/VibeFlix-AndroidStudio"
          test -f "$PROJECT/gradlew"
          echo "ANDROID_PROJECT=$PROJECT" >> "$GITHUB_ENV"
          cd "$PROJECT"

          python3 - <<'PY'
          import os
          from pathlib import Path

          gradle = Path('app/build.gradle')
          text = gradle.read_text(encoding='utf-8')
          replacements = (
              ("applicationId 'org.example.play4u.movyexperiment'", "applicationId 'org.example.play4u.movyexperiment.v31'"),
              ('versionCode 31', 'versionCode ' + os.environ['RELEASE_VERSIONCODE']),
              ("versionName '5.4-catalog-recovery-review31'", "versionName '" + os.environ['RELEASE_VERSIONNAME'] + "'"),
          )
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one baseline marker: {old}')
              text = text.replace(old, new, 1)
          gradle.write_text(text, encoding='utf-8')

          manifest = Path('app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          old_label = 'android:label="Vibeflix Experiment"'
          if text.count(old_label) != 1:
              raise SystemExit('Expected baseline app label was not found exactly once')
          manifest.write_text(text.replace(old_label, 'android:label="Vibeflix"', 1), encoding='utf-8')
          PY

          printf 'sdk.dir=%s\n' "${ANDROID_HOME:-/usr/local/lib/android/sdk}" > local.properties
          chmod +x gradlew

      - name: Run offline unit tests
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT"
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK (no release link)
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT"
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          APK="$ANDROID_PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BT_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools"
          AAPT="$(find "$BT_ROOT" -name aapt -type f | sort -V | tail -1)"
          test -x "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"
          [[ "$BADGING" == *"name='org.example.play4u.movyexperiment.v31'"* ]]
          [[ "$BADGING" == *"versionCode='$RELEASE_VERSIONCODE'"* ]]
          [[ "$BADGING" == *"versionName='$RELEASE_VERSIONNAME'"* ]]
          echo 'Debug package metadata verified. This does not verify signed-release credentials or live playback.'
