name: Verify Android phone build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'release.json'
      - '.github/workflows/build-phone.yml'
      - '.github/workflows/release-phone.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'release.json'
      - '.github/workflows/build-phone.yml'
      - '.github/workflows/release-phone.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Unit tests and debug package verification
    runs-on: ubuntu-latest
    env:
      VIBEFLIX_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VIBEFLIX_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate release metadata
        run: |
          python3 - "$GITHUB_WORKSPACE/release.json" "$GITHUB_ENV" <<'PY'
          import json
          import re
          import sys

          config = json.load(open(sys.argv[1], encoding='utf-8'))
          version_code = config.get('versionCode')
          version_name = config.get('versionName')
          if not isinstance(version_code, int) or version_code < 1:
              raise SystemExit('release.json versionCode must be a positive integer')
          if not isinstance(version_name, str) or not re.fullmatch(r'[A-Za-z0-9._-]{1,64}', version_name):
              raise SystemExit('release.json versionName contains invalid characters')
          with open(sys.argv[2], 'a', encoding='utf-8') as env:
              env.write(f'RELEASE_VERSIONCODE={version_code}\n')
              env.write(f'RELEASE_VERSIONNAME={version_name}\n')
          PY

      - name: Prepare Android source archive
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/vibeflix-src"
          unzip -q android/vibeflix-v31-source.zip -d "$SRC"
          PROJECT="$SRC/VibeFlix-AndroidStudio"
          test -f "$PROJECT/gradlew"
          echo "ANDROID_PROJECT=$PROJECT" >> "$GITHUB_ENV"
          cd "$PROJECT"

          python3 - <<'PY'
          import os
          from pathlib import Path

          gradle = Path('app/build.gradle')
          text = gradle.read_text(encoding='utf-8')
          replacements = (
              ("applicationId 'org.example.play4u.movyexperiment'", "applicationId 'org.example.play4u.movyexperiment.v31'"),
              ('versionCode 31', 'versionCode ' + os.environ['RELEASE_VERSIONCODE']),
              ("versionName '5.4-catalog-recovery-review31'", "versionName '" + os.environ['RELEASE_VERSIONNAME'] + "'"),
          )
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one baseline marker: {old}')
              text = text.replace(old, new, 1)
          gradle.write_text(text, encoding='utf-8')

          manifest = Path('app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          old_label = 'android:label="Vibeflix Experiment"'
          if text.count(old_label) != 1:
              raise SystemExit('Expected baseline app label was not found exactly once')
          manifest.write_text(text.replace(old_label, 'android:label="Vibeflix"', 1), encoding='utf-8')
          PY

          printf 'sdk.dir=%s\n' "${ANDROID_HOME:-/usr/local/lib/android/sdk}" > local.properties
          chmod +x gradlew

      - name: Check the client-key build configuration
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import sys

          key = os.environ.get('VIBEFLIX_SUPABASE_PUBLISHABLE_KEY', '').strip()
          if not key:
              print('::warning::VIBEFLIX_SUPABASE_PUBLISHABLE_KEY is unset; this debug APK will have cloud sign-in disabled.')
              raise SystemExit(0)
          if key.startswith('sb_secret_'):
              raise SystemExit('A Supabase secret key must never be embedded in an Android client.')
          if key.startswith('sb_publishable_'):
              print('Supabase publishable client key is configured for this debug build.')
              raise SystemExit(0)
          try:
              payload = key.split('.')[1]
              payload += '=' * (-len(payload) % 4)
              claims = json.loads(base64.urlsafe_b64decode(payload.encode('ascii')))
          except Exception:
              raise SystemExit('The Android build key is not a recognized publishable/anon client key.')
          if claims.get('role') != 'anon':
              raise SystemExit('Only a Supabase anon/publishable client key may be embedded in the Android build.')
          print('Legacy Supabase anon client key is configured for this debug build.')
          PY

      - name: Run offline unit tests
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT"
          set +e
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/vibeflix-test.log"
          TEST_STATUS=${PIPESTATUS[0]}
          set -e
          if [[ "$TEST_STATUS" -ne 0 ]]; then
            python3 - "$RUNNER_TEMP/vibeflix-test.log" "$ANDROID_PROJECT/app/build/test-results/testDebugUnitTest" <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          def escape(value):
              return value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

          log = Path(sys.argv[1])
          reports = Path(sys.argv[2])
          failures = 0
          for report in reports.glob('*.xml') if reports.exists() else ():
              try:
                  root = ET.parse(report).getroot()
              except ET.ParseError:
                  continue
              for case in root.findall('.//testcase'):
                  failure = case.find('failure')
                  if failure is None:
                      failure = case.find('error')
                  if failure is None:
                      continue
                  label = case.attrib.get('classname', '') + '.' + case.attrib.get('name', 'test')
                  detail = (failure.attrib.get('message') or '') + '\n' + (failure.text or '')
                  print(f'::error title=Android unit test failure::{escape(label + ": " + detail[:5000])}')
                  failures += 1
          if failures == 0 and log.exists():
              for line in log.read_text(encoding='utf-8', errors='replace').splitlines()[-25:]:
                  print(f'::error title=Gradle unit-test failure::{escape(line)}')
          PY
            exit "$TEST_STATUS"
          fi

      - name: Build debug APK (no release link)
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT"
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          APK="$ANDROID_PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BT_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools"
          AAPT="$(find "$BT_ROOT" -name aapt -type f | sort -V | tail -1)"
          test -x "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"
          [[ "$BADGING" == *"name='org.example.play4u.movyexperiment.v31'"* ]]
          [[ "$BADGING" == *"versionCode='$RELEASE_VERSIONCODE'"* ]]
          [[ "$BADGING" == *"versionName='$RELEASE_VERSIONNAME'"* ]]
          echo 'Debug package metadata verified. This does not verify signed-release credentials or live playback.'

      - name: Upload debug APK for private device testing
        uses: actions/upload-artifact@v4
        with:
          name: vibeflix-debug-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ANDROID_PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
