name: Build Windows client

on:
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'
      - 'docs/**'
      - 'README.md'
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: WinUI 3 build (x64)
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore Windows app
        run: dotnet restore windows/VibeFlix.Windows/VibeFlix.Windows.csproj -p:Platform=x64

      - name: Test local library store
        run: dotnet run --project windows/VibeFlix.Windows.Tests/VibeFlix.Windows.Tests.csproj --configuration Release

      - name: Build Windows app
        shell: pwsh
        run: |
          $buildOutput = & dotnet build windows/VibeFlix.Windows/VibeFlix.Windows.csproj --configuration Release --no-restore -p:Platform=x64 2>&1
          $buildExitCode = $LASTEXITCODE
          $buildOutput | ForEach-Object { Write-Host $_ }

          if ($buildExitCode -ne 0) {
            $diagnostics = @($buildOutput | Where-Object { $_.ToString() -match '(?i)\berror\s+[A-Z]+\d+\s*:' })
            if ($diagnostics.Count -eq 0) {
              $diagnostics = @('dotnet build failed; inspect the Windows job log.')
            }

            foreach ($diagnostic in $diagnostics) {
              $message = $diagnostic.ToString().Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=WinUI build diagnostic::$message"
            }
          }

          exit $buildExitCode

      - name: Prepare Windows x64 test bundle
        shell: pwsh
        run: |
          $executable = Get-ChildItem -Path "windows/VibeFlix.Windows/bin" -Filter "VibeFlix.Windows.exe" -File -Recurse | Select-Object -First 1
          if ($null -eq $executable) {
            throw "VibeFlix.Windows.exe was not found in the build output."
          }

          $bundleDirectory = Join-Path $env:RUNNER_TEMP "VibeFlix-Windows-x64-test"
          New-Item -ItemType Directory -Path $bundleDirectory -Force | Out-Null
          Copy-Item -Path (Join-Path $executable.DirectoryName "*") -Destination $bundleDirectory -Recurse -Force

          $expectedArtwork = @(
            "glass-orbit-hero.png",
            "river-of-maps.png",
            "small-hours-club.png",
            "blue-hour-fieldnotes.png",
            "second-staircase.png",
            "paper-comets.png",
            "winter-garden-radio.png"
          )
          foreach ($fileName in $expectedArtwork) {
            $artwork = Join-Path $bundleDirectory "Assets/$fileName"
            if (-not (Test-Path $artwork)) {
              throw "The sample artwork '$fileName' was not copied to the app output."
            }
          }

          $testingInstructions = @'
          VibeFlix Windows x64 - test build

          1. Extract the entire ZIP to a local folder; keep all files together.
          2. Run VibeFlix.Windows.exe.
          3. This is an unpackaged test build, not an installer. Windows 10 (build 19041 or newer) or Windows 11 is required. Install the .NET 10 Desktop Runtime and Windows App SDK 2.7 runtime if they are not already available on the device.
          4. Catalog browsing and provider playback require an internet connection and the selected provider to be available. Stream resolution starts only after you choose Play; URLs and provider request headers stay in memory and are not saved.
          5. No playable media is bundled. Provider playback may be unavailable when a source is offline, restricted, or returns a format Windows cannot play.
          6. My List, History, cached title metadata, and per-episode resume positions are stored locally. The library does not store stream URLs, provider credentials, or media paths.
          '@
          $testingInstructions | Set-Content -Path (Join-Path $bundleDirectory "TESTING.txt") -Encoding utf8

          Write-Host "Prepared test bundle from $($executable.DirectoryName)"

      - name: Upload Windows x64 test build
        uses: actions/upload-artifact@v4
        with:
          name: VibeFlix-Windows-x64-test
          path: ${{ runner.temp }}/VibeFlix-Windows-x64-test
          if-no-files-found: error
          retention-days: 14
