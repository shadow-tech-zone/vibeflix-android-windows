name: Build Windows client

on:
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'
      - 'docs/**'
      - 'README.md'
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: WinUI 3 build (x64)
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Windows app
        run: dotnet restore windows/VibeFlix.Windows/VibeFlix.Windows.csproj -p:Platform=x64

      - name: Build Windows app
        run: dotnet build windows/VibeFlix.Windows/VibeFlix.Windows.csproj --configuration Release --no-restore -p:Platform=x64
