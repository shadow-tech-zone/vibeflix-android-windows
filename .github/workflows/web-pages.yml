name: Web app and GitHub Pages

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'supabase/functions/vibeflix-provider/**'
      - '.github/workflows/web-pages.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'supabase/functions/vibeflix-provider/**'
      - '.github/workflows/web-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vibeflix-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://fzhrpgoouourzzhfvuzk.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_DKNKqUIq6wp1GE-vKfFvSg_CHxeUgn9' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Check provider function
        run: deno check --no-lock supabase/functions/vibeflix-provider/index.ts
      - name: Check provider formatting
        run: deno fmt --check supabase/functions/vibeflix-provider/index.ts supabase/config.toml
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Test local-library behavior
        working-directory: web
        run: npm test
      - name: Lint web app
        working-directory: web
        run: npm run lint
      - name: Build web app
        working-directory: web
        run: npm run build
      - name: Smoke-test live providers
        if: github.event_name == 'workflow_dispatch'
        run: node web/scripts/provider-smoke.mjs
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
